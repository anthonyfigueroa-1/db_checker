[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db_checker"
description = "Checks FreshService tickets to see if open tickets are closed, and if so, will update the D.B. with that and update the json and conversation fields"
version = "2.0"
requires-python = ">=3.10"

[project.scripts]
db_checker = "app.main:runner"
